spring.application.name=research-assistant-backend
server.port=8080

# MySQL：公开配置不保存密码，实际值从环境变量读取。
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/research_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 本地论文和解析数据目录，可按需要改到其他磁盘。
app.upload-dir=${APP_UPLOAD_DIR:./ResearchAssistantData/papers}
app.data-dir=${APP_DATA_DIR:./ResearchAssistantData}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Qdrant REST API 地址。
app.qdrant.url=${QDRANT_URL:http://localhost:6333}

# 对话模型：fake、deepseek、zhipu 或 qwen。
llm.provider=${LLM_PROVIDER:qwen}
llm.max-tokens=2048
llm.temperature=0.2

deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

zhipu.api.key=${ZHIPU_API_KEY:}
zhipu.base-url=${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
zhipu.model=${ZHIPU_MODEL:glm-4-flash}

# Qwen 对话模型。API Key 只从环境变量读取。
qwen.api.key=${DASHSCOPE_API_KEY:}
qwen.base-url=${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
qwen.model=${QWEN_MODEL:qwen-plus}

# Qwen-VL 定向视觉分析，复用 DASHSCOPE_API_KEY，无需第二个 Key。
# 仅对用户显式分析或低置信度资产调用，不把整篇 PDF 发送给模型。
vision.provider=qwen
qwen.vision.api.key=${DASHSCOPE_API_KEY:}
qwen.vision.base-url=${qwen.base-url}
qwen.vision.model=${QWEN_VISION_MODEL:qwen-vl-max}
vision.request-timeout-seconds=120
vision.max-image-bytes=8388608

# 向量模型：fake 或 qwen。
embedding.provider=${EMBEDDING_PROVIDER:qwen}
embedding.fake.dimension=4
qwen.embedding.api.key=${DASHSCOPE_API_KEY:}
qwen.embedding.base-url=${QWEN_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
qwen.embedding.model=${QWEN_EMBEDDING_MODEL:text-embedding-v4}
qwen.embedding.dimension=1024

# 图片生成等较慢任务使用的异步线程池。
async.core-pool-size=2
async.max-pool-size=4
async.queue-capacity=10
async.thread-name-prefix=myagent-async-
