  <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>文献解析测试</title>
  </head>
  <body>
    <h2>文献解析测试</h2>

    <div>
      <label>文献 ID：</label>
      <input id="paperId" type="number" value="1">
    </div>

    <br>

    <button onclick="parsePaper()">开始解析</button>

    <pre id="result"></pre>

    <script>
      function parsePaper() {
        const id = document.getElementById('paperId').value;

        fetch(`http://localhost:8080/api/papers/${id}/parse`, {
          method: 'POST'
        })
        .then(res => res.json())
        .then(data => {
          document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        })
        .catch(err => {
          document.getElementById('result').textContent = err;
        });
      }
    </script>
  </body>
  </html>
